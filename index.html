<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f6">
<title>A Little Something For Kaylla ♡</title>

<style>
:root {
  --pink: #f3a6c5;
  --deep-pink: #d96f9b;
  --light-pink: #fff0f6;
  --text: #694b5b;
  --muted: #9b7b8b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(ellipse at 10% 10%, #ffe0ed 0%, transparent 35%),
    radial-gradient(ellipse at 90% 40%, #ffe8f1 0%, transparent 38%),
    linear-gradient(150deg, #fff9fc, #fff0f6, #fffafd);
}

button { font: inherit; }

button:focus-visible {
  outline: 3px solid #c45c8a;
  outline-offset: 4px;
}

#heart-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.floating-heart {
  position: absolute;
  bottom: -45px;
  color: #e995b7;
  opacity: 0;
  animation: floatHeart linear infinite;
  user-select: none;
}

@keyframes floatHeart {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  15% { opacity: 0.42; }
  85% { opacity: 0.28; }
  100% { transform: translateY(-115vh) rotate(28deg); opacity: 0; }
}

.page {
  position: relative;
  z-index: 1;
  width: min(760px, 92%);
  margin: auto;
  padding: 30px 0 25px;
}

.top-note {
  text-align: center;
  color: var(--deep-pink);
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin: 10px 0 28px;
}

.hero {
  text-align: center;
  padding: 40px 16px 48px;
  animation: fadeIn 1.2s ease both;
}

.flower {
  display: inline-block;
  color: #e68bb0;
  font-size: 43px;
  margin-bottom: 15px;
  animation: gentleTurn 12s linear infinite;
}

@keyframes gentleTurn { to { transform: rotate(360deg); } }

h1 {
  font-size: clamp(40px, 8vw, 68px);
  font-weight: normal;
  line-height: 1.13;
  letter-spacing: -1.5px;
  color: #c96f96;
  margin-bottom: 22px;
}

.hero-subtitle {
  max-width: 520px;
  margin: auto;
  font-size: 17px;
  line-height: 1.9;
  color: var(--muted);
}

.small-divider {
  text-align: center;
  margin: 28px auto;
  color: #d98cac;
  letter-spacing: 9px;
  font-size: 17px;
}

.section-card {
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(230, 170, 196, 0.4);
  border-radius: 25px;
  padding: 30px 27px;
  margin: 22px 0;
  box-shadow: 0 12px 38px rgba(177, 101, 136, 0.075);
  backdrop-filter: blur(8px);
  animation: fadeIn 0.8s ease both;
}

h2 {
  color: #c66e95;
  font-size: 27px;
  font-weight: normal;
  text-align: center;
  line-height: 1.35;
  margin-bottom: 17px;
}

.section-intro {
  text-align: center;
  color: var(--muted);
  line-height: 1.9;
  font-size: 15px;
  margin: 0 auto 20px;
  max-width: 550px;
}

p { line-height: 1.9; }

.button-wrap { text-align: center; margin-top: 23px; }

.pretty-button {
  display: inline-block;
  border: 1px solid #e9b2c9;
  background: linear-gradient(135deg, #f7c4d9, #eaa3c2);
  color: #78435b;
  border-radius: 30px;
  padding: 13px 23px;
  cursor: pointer;
  box-shadow: 0 6px 17px rgba(217, 111, 155, 0.13);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.pretty-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 9px 23px rgba(217, 111, 155, 0.24);
}

.message-box {
  min-height: 65px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  line-height: 1.85;
  color: #a65c7d;
  padding: 17px 5px 0;
  font-size: 16px;
}

.reasons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
  margin-top: 22px;
}

.reason-card {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  min-height: 178px;
  border: 0;
  border-radius: 17px;
  padding: 0;
  background: transparent;
  color: inherit;
  text-align: center;
  cursor: pointer;
  perspective: 900px;
  -webkit-tap-highlight-color: transparent;
}

.reason-card:focus-visible {
  outline: 3px solid #c45c8a;
  outline-offset: 4px;
}

.reason-inner {
  position: relative;
  display: block;
  width: 100%;
  min-height: 178px;
  height: 100%;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(.2,.75,.25,1);
}

.reason-card.is-flipped .reason-inner {
  transform: rotateY(180deg);
}

.reason-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 14px;
  border: 1px solid #f4d9e5;
  border-radius: 17px;
  background: linear-gradient(145deg, #fff4f8, #fffafd);
  box-shadow: 0 5px 15px rgba(217, 111, 155, 0.06);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  overflow-wrap: anywhere;
}

.reason-card:hover .reason-face {
  box-shadow: 0 8px 20px rgba(217, 111, 155, 0.14);
}

.reason-front .reason-icon {
  font-size: 39px;
  line-height: 1.2;
  margin-bottom: 13px;
  filter: drop-shadow(0 3px 4px rgba(217, 111, 155, 0.12));
}

.reason-front small {
  color: #b7839b;
  font: 11px Arial, sans-serif;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.reason-back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, #ffeaf3, #fffafd);
}

.reason-back .back-flower {
  font-size: 21px;
  margin-bottom: 9px;
}

.reason-back p {
  color: #95677d;
  font-size: 14px;
  line-height: 1.75;
}

.heart-burst {
  position: fixed;
  z-index: 20;
  left: 0;
  top: 0;
  pointer-events: none;
  user-select: none;
  color: #e878a7;
  font-size: 20px;
  line-height: 1;
  text-shadow: 0 2px 8px rgba(217, 111, 155, 0.18);
  animation: heartBurst 950ms cubic-bezier(.15,.7,.25,1) forwards;
}

@keyframes heartBurst {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.25) rotate(0deg);
  }
  15% { opacity: 1; }
  100% {
    opacity: 0;
    transform:
      translate(calc(-50% + var(--burst-x)), calc(-50% + var(--burst-y)))
      scale(var(--burst-scale))
      rotate(var(--burst-rotate));
  }
}

.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 25px 0 10px;
}

.time-unit {
  background: linear-gradient(150deg, #fff0f6, #fffafd);
  border: 1px solid #f2d5e2;
  border-radius: 17px;
  padding: 18px 5px 14px;
}

.time-number {
  display: block;
  color: #c66e95;
  font-size: clamp(25px, 5vw, 37px);
  line-height: 1
